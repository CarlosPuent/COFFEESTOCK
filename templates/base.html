{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CoffeeStock{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">

    <link href="{% static 'vendor/fonts/fonts.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/flatpickr/flatpickr.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/coffeestock.css' %}" rel="stylesheet">
</head>
<body>
    {% block content %}{% endblock %}

    {% if messages %}
    <div class="avisos" aria-live="polite">
      {% for message in messages %}
        <div class="aviso aviso-{{ message.tags }}" role="{% if message.tags == 'danger' %}alert{% else %}status{% endif %}">
          <i class="bi {% if message.tags == 'success' %}bi-check-circle-fill{% elif message.tags == 'danger' %}bi-x-circle-fill{% elif message.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %} aviso-icono"></i>
          <div class="aviso-texto">{{ message }}</div>
          <button type="button" class="aviso-cerrar" aria-label="Cerrar"><i class="bi bi-x-lg"></i></button>
        </div>
      {% endfor %}
    </div>
    {% endif %}
    <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'vendor/flatpickr/flatpickr.min.js' %}"></script>
    <script src="{% static 'vendor/flatpickr/l10n/es.js' %}"></script>
    <script src="{% static 'js/coffeestock.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
