{% extends 'dashboard/dashboard_base.html' %}

{% block title %}Eliminar - CoffeeStock{% endblock %}

{% block dashboard_content %}
<div class="tarjeta-formulario">
  <h1 class="mb-3"><i class="bi bi-trash3 me-2"></i>Eliminar</h1>
  <p>¿Seguro que deseas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger"><i class="bi bi-trash3 me-1"></i>Sí, eliminar</button>
    <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancelar</a>
  </form>
</div>
{% endblock %}
