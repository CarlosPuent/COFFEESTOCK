{% extends 'dashboard/dashboard_base.html' %}
{% load crispy_forms_tags %}

{% block title %}Registrar merma - CoffeeStock{% endblock %}

{% block dashboard_content %}
<h1 class="h3 mb-3"><i class="bi bi-clipboard2-plus me-2"></i>Registrar merma</h1>

<div style="max-width: 500px;">
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary btn-lg w-100">
      <i class="bi bi-check-lg me-1"></i>Registrar merma
    </button>
  </form>
</div>
{% endblock %}
