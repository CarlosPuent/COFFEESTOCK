{% extends 'dashboard/dashboard_base.html' %}

{% block title %}Eliminar insumo - CoffeeStock{% endblock %}

{% block dashboard_content %}
<h1 class="h3 mb-3"><i class="bi bi-trash3 me-2"></i>Eliminar insumo</h1>
<p>¿Seguro que deseas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger"><i class="bi bi-trash3 me-1"></i>Sí, eliminar</button>
  <a href="{% url 'dashboard:insumo_list' %}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancelar</a>
</form>
{% endblock %}
