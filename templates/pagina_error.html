{% extends 'base.html' %}

{% block title %}{{ titulo_error }} - CoffeeStock{% endblock %}

{% block content %}
<main class="pagina-error">
  <div class="pagina-error-tarjeta">
    <div class="pagina-error-icono"><i class="bi {% block icono_error %}bi-cup-hot{% endblock %}"></i></div>
    <div class="pagina-error-codigo">{% block codigo_error %}{% endblock %}</div>
    <h1 class="pagina-error-titulo">{% block titulo_error %}{% endblock %}</h1>
    <p class="pagina-error-texto">{% block texto_error %}{% endblock %}</p>
    <div class="d-flex flex-wrap justify-content-center gap-2">
      <a href="javascript:history.back()" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Volver</a>
      <a href="/" class="btn btn-primary"><i class="bi bi-house me-1"></i>Ir al inicio</a>
    </div>
  </div>
</main>
{% endblock %}
